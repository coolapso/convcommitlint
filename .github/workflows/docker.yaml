name: Docker
on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        description: The release tag to build
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with: 
          fetch-tags: true
          fetch-depth: 0
        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to github container registry
        env:
          REGISTRY: ghcr.io
          USERNAME: ${{ github.actor }}
          PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if printf '%s' "$PASSWORD" | docker login "$REGISTRY" --username "$USERNAME" --password-stdin; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            sleep "$((attempt * 5))"
          done

      - name: Set docker_tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git check-ref-format --allow-onelevel "refs/tags/$RELEASE_TAG"
          docker_tag="${RELEASE_TAG#v}"
          printf 'DOCKER_TAG=%s\n' "$docker_tag" >> "$GITHUB_ENV"
          printf 'Going to build: %s\n' "$docker_tag"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: coolapso/convcommitlint:latest,coolapso/convcommitlint:${{ env.DOCKER_TAG }},ghcr.io/coolapso/convcommitlint:latest,ghcr.io/coolapso/convcommitlint:${{ env.DOCKER_TAG }}
          build-args: VERSION=${{ inputs.release_tag }}
